<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid dark background — iOS rounds corners automatically -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  <!-- Building/crate icon in amber (Nirman OS brand color) -->
  <!-- Outer hexagon shape -->
  <path d="M160 240V160l96-56 96 56v80l-96 56-96-56z" fill="none" stroke="#d4a017" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Roof lines -->
  <path d="M160 160l96 56 96-56" stroke="#d4a017" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <!-- Vertical center line -->
  <path d="M256 216v80" stroke="#d4a017" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Foundation bar -->
  <rect x="140" y="312" width="232" height="12" rx="6" fill="#d4a017"/>
</svg>
