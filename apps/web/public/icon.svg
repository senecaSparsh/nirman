<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid dark background — iOS rounds corners automatically -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  <!-- Building/house icon in amber (Nirman OS brand color) -->
  <!-- Filled building body -->
  <path d="M140 280 L140 180 L256 100 L372 180 L372 280 Z" fill="#d4a017"/>
  <!-- Inner cutout (dark) creates hollow building outline -->
  <path d="M180 270 L180 200 L256 150 L332 200 L332 270 Z" fill="#1a1a1a"/>
  <!-- Vertical center divider -->
  <rect x="248" y="150" width="16" height="120" fill="#d4a017"/>
  <!-- Foundation bar -->
  <rect x="120" y="310" width="272" height="20" rx="8" fill="#d4a017"/>
</svg>
