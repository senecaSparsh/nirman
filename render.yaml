# Render deployment config — https://render.com/docs/blueprint-spec
#
# What this creates:
#   1. A PostgreSQL database (free tier OK for demo; upgrade for production)
#   2. A web service running the Next.js app
#
# The web service:
#   - Installs deps with pnpm
#   - Runs Prisma migrations (migrate deploy)
#   - Runs the demo seed (creates company, users, sample data)
#   - Sets demo passwords so the owner can sign in
#   - Builds the Next.js app
#   - Starts the production server
#
# Required env vars (set in Render dashboard or via .env):
#   NEXT_PUBLIC_APP_URL — the public URL of the deployed app (e.g. https://nirman.onrender.com)
#   SEED_PASSWORD — the password for demo users (defaults to "nirman123" if not set)
#
# After first deploy, sign in with:
#   amit@nirman.in / <SEED_PASSWORD>  (OWNER — full access)

databases:
  - name: nirman-db
    databaseName: nirman_inventory
    user: nirman
    region: oregon
    plan: free
    ipAllowList: []  # allow connections from Render services only

services:
  - type: web
    name: nirman-inventory
    runtime: node
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /sign-in

    # Node + pnpm setup, build, then run migrations only (no seed data)
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      pnpm --filter @nirman/db generate &&
      pnpm --filter @nirman/db migrate:deploy

    # Start the production Next.js server
    startCommand: cd apps/web && pnpm start

    # Env vars that come from other Render services
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nirman-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 23.11.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TURBO_TELEMETRY_DISABLED
        value: "1"
      - key: BETTER_AUTH_URL
        value: https://nirman-inventory.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://nirman-inventory.onrender.com
      # Generate a secret: openssl rand -hex 32
      # Set this in the Render dashboard (don't commit real secrets):
      # - key: BETTER_AUTH_SECRET
      #   sync: false  # paste the generated secret
