name: Deploy production

# Manual production deploy — mirrors scripts/deploy-prod.sh for environments
# where SSH/Coolify are unreachable from the local machine (egress filtering).
# Triggers Coolify's deploy API from a GitHub runner (unrestricted egress),
# then watches for the container swap via a canary route.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy = build+swap; status = show latest Coolify deployment"
        required: false
        default: deploy
        type: choice
        options: [deploy, status]
      depuuid:
        description: "deployment_uuid to inspect in status mode"
        required: false
        type: string

jobs:
  status:
    if: inputs.mode == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Coolify deployments
        run: |
          RESP=$(curl -sS -m 15 \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deployments/${{ inputs.depuuid || 'wz7hauz6oailb6tuyrsitpay' }}")
          echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); ks=["status","status_reason","created_at","updated_at","finished_at","commit","pull_request_id","is_webhook","build_server_id","application_id"]; print({k:d.get(k) for k in ks if k in d}); print("LOG_TAIL:", (d.get("current_process_status") or "")[:200])'

  deploy:
    if: inputs.mode != 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: 82.41.67.77
      HEALTH_URL: https://${{ secrets.PROD_DOMAIN }}/api/health
      FINGERPRINT_URL: https://${{ secrets.PROD_DOMAIN }}/sign-in
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/devin_nirman
          chmod 600 ~/.ssh/devin_nirman
          ssh-keyscan -t ed25519,rsa "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Disk-space guard
        run: |
          FREE_MB=$(ssh -o ConnectTimeout=10 -o BatchMode=yes -i ~/.ssh/devin_nirman \
            root@"$VPS_HOST" 'df -m / | tail -1 | awk "{print \$4}"' 2>/dev/null || echo "")
          if [ -z "$FREE_MB" ]; then
            echo "::warning::SSH to VPS unreachable — skipping disk check. Coolify builds are zero-downtime: a failed build keeps the old container serving."
          elif [ "$FREE_MB" -lt 4096 ]; then
            echo "::notice::Disk at ${FREE_MB}MB free — pruning unused images + build cache"
            ssh -o BatchMode=yes -i ~/.ssh/devin_nirman root@"$VPS_HOST" \
              'docker image prune -a -f >/dev/null 2>&1; docker builder prune -f >/dev/null 2>&1' || true
          else
            echo "Disk OK: ${FREE_MB}MB free"
          fi

      - name: Trigger Coolify deploy
        id: trigger
        run: |
          RESP=$(curl -sS -m 15 \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -X POST "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -d "{\"uuid\":\"${{ secrets.COOLIFY_APP_UUID }}\",\"force\":false}" \
            -w '\n%{http_code}' 2>&1) || { echo "::error::Coolify API unreachable: $RESP"; exit 1; }
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy trigger failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          DEP_UUID=$(echo "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["deployments"][0]["deployment_uuid"])')
          echo "dep_uuid=$DEP_UUID" >> "$GITHUB_OUTPUT"
          echo "Deployment queued: $DEP_UUID"

      - name: Wait for container swap (deployment status)
        env:
          DEP_UUID: ${{ steps.trigger.outputs.dep_uuid }}
        run: |
          # Poll the deployment's own lifecycle — status flips to 'finished'
          # only after Coolify builds, swaps, and health-checks the container.
          # Page-content checks (canary type, bundle fingerprint) can't tell
          # builds apart when a diff doesn't touch the probed page's chunks.
          ELAPSED=0
          while [ $ELAPSED -lt 1080 ]; do
            sleep 20
            ELAPSED=$((ELAPSED + 20))
            RESP=$(curl -skS -m 10 \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Accept: application/json" \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEP_UUID" 2>/dev/null || echo '{}')
            STATUS=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || echo "")
            case "$STATUS" in
              finished)
                COMMIT=$(echo "$RESP" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("commit") or "")[:12])')
                echo "Deployment finished after ${ELAPSED}s (commit=$COMMIT)"
                exit 0 ;;
              failed|*error*|cancelled)
                echo "::error::Deployment ended: $STATUS"
                exit 1 ;;
            esac
            [ $((ELAPSED % 120)) -eq 0 ] && echo "  ...deploying (${ELAPSED}s, status=$STATUS)"
          done
          echo "::error::Deployment still not finished after 18min"
          exit 1

      - name: Verify health
        run: |
          curl -skS -m 10 -f "$HEALTH_URL" || { echo "::error::Health check failed post-swap"; exit 1; }
          echo ""
          echo "Deploy complete and healthy."
