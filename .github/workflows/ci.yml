# CI Gate — runs lint, typecheck, tests, and build on every PR.
# Blocks merge to main if any check fails.
#
# This prevents broken code from reaching Render — a failed lint/typecheck
# here means the production build would also fail (or run with type errors
# that cause runtime crashes).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + Typecheck ──────────────────────────────────────────
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nirman/db generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ── Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nirman/db generate

      - name: Run tests
        run: pnpm --filter @nirman/services test

  # ── Migration coverage ─────────────────────────────────────────
  # Verifies the committed migrations produce the current schema.prisma.
  # Catches "edited schema.prisma + forgot `prisma migrate dev`" — the
  # drift that made a prod deploy unbootable (db push cannot add required
  # columns to populated tables, so the drift was permanent and silent).
  migrations:
    name: Migration coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migrations produce schema.prisma
        working-directory: packages/db
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow"
          --exit-code

  # ── Production Build ──────────────────────────────────────────
  # Verifies the webpack build succeeds (catches build-time errors
  # before they reach Render).
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nirman/db generate

      - name: Build (webpack)
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: "postgresql://placeholder@localhost:5432/placeholder" # build doesn't need a real DB
          BETTER_AUTH_SECRET: "ci-placeholder-secret"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          BETTER_AUTH_URL: "http://localhost:3000"
