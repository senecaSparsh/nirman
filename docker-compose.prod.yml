# ─────────────────────────────────────────────────────────────────────────────
# Nirman Inventory OS — Docker Compose for Coolify / VPS production
#
# This is the PRODUCTION compose file for Coolify. The local-dev Postgres-only
# compose file is docker-compose.yml (unchanged).
#
# In Coolify, set "Docker Compose File" to `docker-compose.prod.yml`
# (Service settings → Build/Deploy → Docker Compose File path).
#
# What this creates:
#   1. PostgreSQL 16 database with a persistent volume
#   2. Next.js web app with:
#      - Persistent volume for uploaded files (storage/uploads/)
#      - Health check via /api/health
#      - Auto-recovery wrapper (crash restart, graceful shutdown, memory monitor)
#      - Prisma migrations + seed run automatically on container start
#
# This IS the production deploy path (Coolify + VPS). Render is not used.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Coolify can also provision a managed Postgres, but running it in-compose
  # is cheaper (shares the VPS) and fine for a 50-user ERP. Back up the
  # volume regularly (Coolify has built-in volume backup, or use pg_dump cron).
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Bound container logs — the default json-file driver is unbounded and
    # would slowly fill the 120GB disk over months of uptime.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nirman_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-nirman}
      # ⚠️  POSTGRES_PASSWORD is read ONLY at first database init (empty volume).
      # Changing it in Coolify env afterwards does NOT update the database —
      # but web's DATABASE_URL picks up the NEW value → instant auth-failure
      # outage. To rotate: ALTER USER inside psql, then update the env to match.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_please}
    volumes:
      - pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nirman} -d ${POSTGRES_DB:-nirman_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Don't expose the DB port to the public internet unless you need to
    # connect from outside (e.g., Prisma Studio from your laptop).
    # To connect locally: Coolify → Service → Ports → expose 5432 temporarily.
    # expose:
    #   - "5432"

  # ── Web App (Next.js) ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time.
      # Set these in Coolify's "Build Args" section (or .env on the VPS).
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    # Coolify auto-generates Traefik labels from the domain configured in the
    # UI (Service → Domains). Do NOT add manual Traefik labels here — they
    # conflict with Coolify's auto-generated ones (different router/service
    # names for the same host → Traefik 503 "no available server").
    # The `coolify` network below lets Coolify's Traefik proxy reach this container.
    networks:
      - default
      - coolify
    environment:
      # ── Database (pointed at the db service above) ──
      # connection_limit=5 keeps us within Postgres's max_connections (default 100).
      # pool_timeout=10 fails fast instead of hanging if the pool is exhausted.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nirman}:${POSTGRES_PASSWORD:-changeme_please}@db:5432/${POSTGRES_DB:-nirman_inventory}?connection_limit=5&pool_timeout=10"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-nirman}:${POSTGRES_PASSWORD:-changeme_please}@db:5432/${POSTGRES_DB:-nirman_inventory}?connection_limit=5"
      NODE_ENV: production
      # ── Auth ──
      # BETTER_AUTH_URL must match NEXT_PUBLIC_APP_URL (the public URL).
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Customer-portal session signing (falls back to BETTER_AUTH_SECRET).
      PORTAL_COOKIE_SECRET: ${PORTAL_COOKIE_SECRET:-${BETTER_AUTH_SECRET}}
      # ── Telephony (optional — calls/SMS disabled without these) ──
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      # ── App config ──
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SEED_PASSWORD: ${SEED_PASSWORD:-nirman123}
      CRON_SECRET: ${CRON_SECRET}
      # Guards POST /api/workflow-scheduler (due scheduled workflows).
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:-}
      # ── Sentry (optional — leave empty to disable) ──
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # ── Tuning (leave NODE_OPTIONS empty — the auto-memory wrapper
      #    detects available RAM from cgroup limits and sets
      #    --max-old-space-size automatically) ──
      NODE_OPTIONS: ""
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # ── Upload directory (persistent volume) ──
      UPLOAD_DIR: /app/storage/uploads
      # ── Demo seed (FIRST DEPLOY ONLY) ──
      # Set to "true" on the first deploy to create demo company + users +
      # sample data. Then set back to "false" (or remove) — the demo seed
      # WIPES transactional data on every run, so leaving it enabled will
      # destroy user-entered data on each restart.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      # Uploaded files (cheque photos, BBA/ATS docs, legal docs, expense
      # receipts, call recordings) persist across deploys/restarts.
      - uploads:/app/storage/uploads
      # Pre-migration pg_dump snapshots land here (see docker-entrypoint.sh).
      # Shared with the `backup` service — same volume, same retention story.
      - pgbackups:/backups
    healthcheck:
      # Liveness check — no DB query (returns 200 if the process is alive).
      # The start-with-recovery wrapper does its own deep health check
      # (with DB ping) internally and auto-restarts on zombie states.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Scheduler — internal cron caller ─────────────────────────────────
  # Coolify/Docker has no platform cron. This sidecar curls the app's cron
  # endpoints on a timer over the internal network (never exposed publicly):
  #   /api/cron/reminders      every 15 min  (payment/rent/doc reminders)
  #   /api/workflow-scheduler  every 5 min   (due scheduled workflows)
  #   /api/cron/backup         daily         (BackupRecord export)
  #   /api/cron/hsn-seed       weekly        (HSN/GST master re-seed)
  # Requires CRON_SECRET + SCHEDULER_SECRET in Coolify env (same values the
  # web service uses).
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - default
    environment:
      APP_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET}
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:-}
    volumes:
      - ./apps/web/scripts/scheduler.sh:/scheduler.sh:ro
    command: ["sh", "/scheduler.sh"]

  # ── Backup — self-contained data protection ────────────────────────────
  # Daily pg_dump + uploads tarball to the pgbackups volume (14-day
  # retention). Complements /api/cron/backup (which stores BackupRecord rows
  # inside Postgres) — this produces real dump files that survive DB
  # corruption. Set RCLONE_REMOTE + RCLONE_CONFIG_* env vars in Coolify to
  # also sync off-VPS (Backblaze B2, S3, etc.) — off by default.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nirman_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-nirman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_please}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      # Optional off-site sync — see apps/web/scripts/backup.sh header.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      # Pass through any RCLONE_CONFIG_* vars set in Coolify.
      RCLONE_CONFIG_B2_TYPE: ${RCLONE_CONFIG_B2_TYPE:-}
      RCLONE_CONFIG_B2_ACCOUNT: ${RCLONE_CONFIG_B2_ACCOUNT:-}
      RCLONE_CONFIG_B2_KEY: ${RCLONE_CONFIG_B2_KEY:-}
    volumes:
      - ./apps/web/scripts/backup.sh:/backup.sh:ro
      - pgbackups:/backups
      - uploads:/uploads-src:ro
    command: ["sh", "/backup.sh"]

networks:
  # The `coolify` network is created by Coolify and shared with the Traefik
  # proxy container. The web service joins it so Traefik can route to it.
  coolify:
    external: true

volumes:
  pgdata-v2:
    # Postgres data — CRITICAL: back this up. The `backup` service dumps it
    # daily into pgbackups; also enable Coolify → db → Backups for off-VPS.
  uploads:
    # User-uploaded files — archived daily by the `backup` service too.
  pgbackups:
    # pg_dump + uploads archives (14-day retention). Copy off-VPS via
    # RCLONE_REMOTE env vars, Coolify volume backups, or VirtFusion snapshots.
